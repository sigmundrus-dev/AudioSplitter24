
name: Build Audio Splitter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AudioSplitter-Winamp-GitHub.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q AudioSplitter-Winamp-GitHub.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/AudioSplitter-Winamp-GitHub
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioSplitter-Winamp-APK
          path: extracted/AudioSplitter-Winamp-GitHub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
