
name: Build Audio Splitter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AudioSplitter-Winamp-GitHub.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          
      - name: Extract project
        run: |
          mkdir -p extracted
          echo "Files in repository:"
          ls -la
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found in repository root"
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -n 80

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioSplitter-Winamp-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
